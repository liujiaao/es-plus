<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ES-Plus 开发文档 · Ant Design Vue 端</title>

    <!--
      深色首屏：主题类必须在**首帧之前**挂到 <html> 上（审计 P1-4）。
      此前本站明确 light-only；现在与主文档站同一套口径：localStorage 'theme' 优先，
      否则跟随系统。这段内联脚本与 src/stores/theme.js 的判定规则逐字一致，
      check:dark-mode 会断言两处一致 —— 改规则时两处一起改。
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme')
          var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
          var root = document.documentElement
          root.classList.toggle('dark', dark)
          root.style.colorScheme = dark ? 'dark' : 'light'
          // vxe-table 4.x 的暗色变量挂在 [data-vxe-ui-theme="dark"] 上，不认 `dark` 类
          root.setAttribute('data-vxe-ui-theme', dark ? 'dark' : 'light')
        } catch (e) {
          /* 隐私模式下 localStorage 会抛错：退回浅色，不阻塞渲染 */
        }
      })()
    </script>

    <!--
      静态 meta：主文档站把 title/description/og 放在 unhead 里由 JS 注入，
      不执行 JS 的抓取器与社交平台抓不到；本站此前 index.html 里一行 meta 都没有
      （连 description 和 og 都没有），分享出去是无描述、无卡片的裸链接。
      这里直接写静态标签，保证非 JS 环境也能拿到。
      og:url / og:image 指向主文档站：三端是同一个产品的三个渲染端，
      分享卡片统一用主文档站的规范地址与卡片图（单一真源在 es-plus-docs）。
    -->
    <meta
      name="description"
      content="ES-Plus 的 Ant Design Vue 渲染端文档：同一份 JSON 配置驱动 EsForm / EsTable / EsDialog / EsCrudPage，与 Vue 2 / Vue 3 端共用同一套字段与列定义。"
    />
    <meta name="keywords" content="Ant Design Vue, CRUD, 配置化表单, 配置化表格, JSON Schema, Vue 3" />
    <link rel="canonical" href="https://antdv.esplus-ai.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ES-Plus" />
    <meta property="og:title" content="ES-Plus 开发文档 · Ant Design Vue 端" />
    <meta
      property="og:description"
      content="同一份 JSON 配置驱动 EsForm / EsTable / EsDialog / EsCrudPage，与 Vue 2 / Vue 3 端共用同一套字段与列定义。"
    />
    <meta property="og:url" content="https://antdv.esplus-ai.com/" />
    <meta property="og:image" content="https://main.esplus-ai.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://main.esplus-ai.com/og-image.png" />
  </head>
  <body>
    <div id="app"></div>
    <!-- 分析统计（审计 3.5）：GoatCounter，无 Cookie。no_onload + router afterEach 显式计数。
         端点单一真源 docs/analytics/analytics.json，check:analytics 核对三站一致。 -->
    <script>window.goatcounter = { no_onload: true }</script>
    <script data-goatcounter="https://es-plus.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
