name: Deploy Docs

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            es-plus-docs/package-lock.json
            es-pc/package-lock.json

      # Install at root so workspaces (@es-plus/vue3 etc.) get linked AND
      # root devDeps (husky) get installed. Without --legacy-peer-deps the
      # docs site's @unhead/vue + vite peer ranges conflict in npm 10+.
      - name: Install monorepo deps
        run: npm ci --legacy-peer-deps

      - name: Install docs site deps (es-plus-docs)
        run: cd es-plus-docs && npm ci --legacy-peer-deps

      - name: Install docs site deps (es-pc)
        run: cd es-pc && npm ci --legacy-peer-deps

      # es-pc 依赖 @es-plus/adapter-antdv（其唯一运行时依赖是 @es-plus/core）。
      # 两者都 external 引用构建产物，故先构建 core 再 adapter-antdv。
      - name: Build @es-plus/core + adapter-antdv (es-pc deps)
        run: |
          npm run build --workspace @es-plus/core
          npm run build --workspace @es-plus/adapter-antdv

      - name: Build docs site (es-plus-docs)
        run: cd es-plus-docs && npm run build
        env:
          VITE_BASE_URL: /es-plus/

      - name: Build docs site (es-pc)
        run: cd es-pc && npm run build
        env:
          VITE_BASE_URL: /es-plus/es-pc/

      # 单一 Pages 站点：es-plus-docs 在根，es-pc 在 /es-pc/ 子路径
      - name: Combine sites into Pages artifact
        run: |
          mkdir -p _site
          cp -r es-plus-docs/dist/. _site/
          mkdir -p _site/es-pc
          cp -r es-pc/dist/. _site/es-pc/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
