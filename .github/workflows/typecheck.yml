name: Typecheck

# Independent typecheck job per package — catches TS errors that the build
# step might not surface (e.g. vite build with skipDiagnostics, or src files
# excluded from build but still in tsconfig). Stage A of the production-grade
# rollout (added 2026-06-05).

on:
  push:
    branches: [master, develop, dev-lja]
  pull_request:
    branches: [master, develop, dev-lja]
  workflow_dispatch:

jobs:
  typecheck:
    name: Typecheck (${{ matrix.pkg }})
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel siblings on a single failure — easier to triage when all
      # packages get to report independently.
      fail-fast: false
      matrix:
        pkg: [core, shared, vue2, vue3, adapter-antdv, cli, mcp-server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps

      # vue2 / vue3 typecheck reads from @es-plus/core's emitted .d.ts in
      # build/, so build core + shared first (cheap, just tsc).
      - name: Build @es-plus/core (dep for vue2/vue3 typecheck)
        if: matrix.pkg != 'core'
        run: npm run build --workspace @es-plus/core

      - name: Build @es-plus/shared (dep for cli/mcp-server typecheck)
        if: matrix.pkg == 'cli' || matrix.pkg == 'mcp-server'
        run: npm run build --workspace @es-plus/shared

      - name: Typecheck ${{ matrix.pkg }}
        run: npm run typecheck --workspace @es-plus/${{ matrix.pkg }}

  lint:
    name: Lint (eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      # 历史教训：eslint.config.js 曾是 ESM 但根 package.json 无 "type":"module"，
      # 配置加载即失败 → lint 从未真正运行。改为 .mjs 后当前 0 error / 警告放行。
      - name: ESLint (0 errors)
        run: npm run lint

  docs-build:
    # 三个文档站的构建此前只在 deploy-docs（master）里跑，PR 阶段无门禁 ——
    # 路由/别名/配置回归只能合入后暴露。这里在 PR/push 阶段就构建三站。
    name: Docs build (${{ matrix.site }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: [es-plus-docs, es-pc, es-eui]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # es-eui 的 prebuild 会重建本地 @es-plus/core / @es-plus/vue2（用根 workspace 的 tsc/vite），
      # 所以必须先装根依赖（与 deploy-docs 的安装顺序一致）。
      - name: Install monorepo deps
        run: npm ci --legacy-peer-deps
      - name: Install site deps (${{ matrix.site }})
        run: cd ${{ matrix.site }} && npm ci --legacy-peer-deps
      - name: Build site (${{ matrix.site }})
        run: cd ${{ matrix.site }} && npm run build

  consistency:
    name: Consistency (type exports + schema single-source)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      # 三包契约类型导出一致 + schema↔类型同步 + schemas 单源无漂移
      - name: Check cross-renderer consistency
        run: npm run check:consistency

  golden:
    name: Golden config→code (Layer-1 deterministic scorer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      # score-golden.mjs imports generateFromConfig from @es-plus/shared's build/
      - name: Build @es-plus/shared
        run: npm run build --workspace @es-plus/shared
      # Free per-PR gate: every golden config validates + generates coherent code
      # (fields/actions/tableBtn codes preserved; extension points marked, not dropped)
      # AND the emitted code is actually parsed (pageSchema JSON payload + SFC
      # <script> blocks) — previously the scorer only string-matched, so
      # syntactically broken output could pass the only PR-time golden gate.
      - name: Score golden corpus
        run: npm run test:golden

  golden-compile:
    # 整个 golden 语料（24 个用例 × 三个渲染目标）真实 `vite build` 编译。
    # 此前只在夜间跑（eval-llm.yml），而夜间任务不阻塞合并、也不阻塞部署 ——
    # 生成器产出「能通过字符串断言但编译不过」的代码时，PR 上是绿的。
    # e2e.yml 的 6 个组合虽然也在 PR 编译，但每个组合只覆盖 2 个合成页面；
    # 这里覆盖的是全部策划用例的广度。
    name: Golden corpus compiles (all targets)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Build shared + all target packages + cli
        run: |
          npm run build --workspace @es-plus/shared
          npm run build --workspace @es-plus/vue3
          npm run build --workspace @es-plus/vue2
          npm run build --workspace @es-plus/adapter-antdv
          npm run build --workspace @es-plus/cli
      - name: Compile whole golden corpus (vite build per case)
        run: npm run golden:e2e


