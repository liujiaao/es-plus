name: LLM Accuracy Eval (nightly)

# Layer-2 accuracy scorer: drives the real NL→config reasoning path against the
# golden corpus and measures in-schema-intent zero-edit accuracy (target >= 95%).
#
# This needs an ANTHROPIC_API_KEY and costs money, so it does NOT run per-PR — only
# nightly and on manual dispatch. The free per-PR gate is the `golden` job in
# typecheck.yml (Layer-1 deterministic scorer). Without the secret, eval:llm exits 0
# as a no-op, so a fork/PR without the key never fails here.

on:
  schedule:
    # 03:17 UTC daily — off the top of the hour on purpose.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: 'Minimum in-schema intent accuracy (0-1)'
        required: false
        default: '0.95'

# Serialize per ref so two overlapping nightly runs can't race the badge commit.
# Do NOT cancel in-progress — an eval run costs money; let a started one finish.
concurrency:
  group: eval-llm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  eval-llm:
    name: NL→config accuracy vs golden
    runs-on: ubuntu-latest
    # Needed only for the badge commit-back below; everything else is read-only.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Build @es-plus/shared
        run: npm run build --workspace @es-plus/shared
      # Optional dep — installed only for this eval job, never a runtime dep.
      - name: Install Anthropic SDK
        run: npm install --no-save @anthropic-ai/sdk --legacy-peer-deps
      - name: Run LLM accuracy eval
        id: eval
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional: point at an Anthropic-Messages-compatible gateway (self-host /
          # proxy / third-party relay). Leave the secret unset to use api.anthropic.com.
          # The relay MUST speak the native /v1/messages protocol — an OpenAI-only
          # endpoint will not work with @anthropic-ai/sdk.
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          # Optional repo variable: the model id the endpoint actually serves
          # (default below is a real Anthropic id; a relay likely needs its own).
          ESPLUS_EVAL_MODEL: ${{ vars.ESPLUS_EVAL_MODEL }}
          ESPLUS_EVAL_TARGET: ${{ github.event.inputs.target || '0.95' }}
        run: npm run eval:llm -- --require-key
      # Commit the refreshed accuracy record + shields badge so the README badge
      # tracks reality — even on a RED run (always()), so a regression turns the
      # badge yellow/red instead of silently freezing on an old green number.
      # Change-detected (no empty commits) and [skip ci] (no CI feedback loop).
      # Guarded to this repo so forks never attempt a push they can't make.
      - name: Commit accuracy badge + record
        if: always() && github.repository_owner == 'liujiaao' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          FILES="__tests__/golden/last-accuracy.json __tests__/golden/last-accuracy-badge.json"
          if git status --porcelain -- $FILES | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $FILES
            git commit -m "chore(eval): refresh nightly accuracy badge [skip ci]"
            git push
          else
            echo "No accuracy change to commit."
          fi

  # NOTE: 整个 golden 语料的真实编译（golden:e2e）已移到 typecheck.yml 的
  # `golden-compile` 作业 —— 它是确定性的、不需要 API key，没有理由只在夜间跑：
  # 夜间任务不阻塞合并、也不阻塞部署，生成器产出编译不过的代码时 PR 上仍是绿的。
  # 本文件现在只保留需要 ANTHROPIC_API_KEY（花钱）的 Layer-2 准确率评估。
  #
  # 放在 typecheck.yml 还有一个附带好处：deploy-docs 通过 workflow_run 依赖 Typecheck，
  # 因此「全语料能编译」现在也间接成为了部署前置条件。
