<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>页面不存在 · ES-Plus</title>
    <style>
      :root {
        --es-brand-primary: #3b82f6;
        --es-brand-accent: #06b6d4;
        --es-text-primary: #1f2329;
        --es-text-regular: #4b5563;
        --es-text-secondary: #8a919f;
        --es-bg-page: #f7f8fa;
        --es-border-light: #e4e8ee;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--es-bg-page);
        color: var(--es-text-primary);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      }
      .wrap { max-width: 560px; width: 100%; text-align: center; }
      .code {
        font-size: 72px;
        font-weight: 800;
        line-height: 1;
        margin: 0;
        background: linear-gradient(135deg, var(--es-brand-primary), var(--es-brand-accent));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { font-size: 14px; line-height: 1.7; color: var(--es-text-regular); margin: 0 0 8px; }
      code {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 13px;
        background: #fff;
        border: 1px solid var(--es-border-light);
        border-radius: 6px;
        padding: 2px 6px;
        word-break: break-all;
      }
      .actions { margin-top: 24px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
      a.btn {
        display: inline-block;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 14px;
        text-decoration: none;
        border: 1px solid var(--es-border-light);
        color: var(--es-text-primary);
        background: #fff;
      }
      a.btn.primary {
        background: var(--es-brand-primary);
        border-color: var(--es-brand-primary);
        color: #fff;
      }
      .hint { margin-top: 20px; font-size: 12px; color: var(--es-text-secondary); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p class="code">404</p>
      <h1>这个地址没有对应页面</h1>
      <p>可能是链接过期、拼写有误，或者页面已经改名。</p>
      <p>请求的地址：<code id="requested"></code></p>
      <div class="actions">
        <a class="btn primary" id="home" href="./">返回文档首页</a>
        <a class="btn" href="https://github.com/liujiaao/es-plus" rel="noopener">GitHub 仓库</a>
      </div>
      <p class="hint" id="hint"></p>
    </div>

    <script>
      /*
       * 深链兜底：三站都是 hash 路由（`/#/guide/installation`），但旧 sitemap、外部文章与
       * 聊天工具里的链接往往写成路径式。这个页面把路径改写成 hash 再跳一次，让「看起来
       * 指对了」的链接真的落到内容上，而不是停在 404。
       *
       * 同一份文件会出现在两个宿主上，基准不同：
       *   · EdgeOne（main.esplus-ai.com 等自有域名）：站点在域名根，BASE = '/'，没有子站；
       *   · GitHub Pages 镜像：主站在 /es-plus/，es-pc / es-eui 在它的子路径下。
       * 所以按 hostname 选基准 —— 把一个宿主的常量写死，另一边的深链就会被改写到错误地址。
       *
       * BASE 与 vite.config.ts 的 SITE_HOSTNAME 同口径；PAGES_BASE / PAGES_SITES 与
       * deploy-docs.yml 的发布路径同口径。scripts/check-sitemap.mjs 会校验，并**用假
       * location 真跑一遍**这里的改写逻辑（这个文件只在线上 404 时才执行）。
       */
      var BASE = '/'
      var PAGES_HOST = 'liujiaao.github.io'
      var PAGES_BASE = '/es-plus/'
      // 子站前缀：与 deploy-docs.yml 的 `cp -r <dir>/dist/. _site/<sub>/` 一致
      var PAGES_SITES = ['/es-plus/es-pc/', '/es-plus/es-eui/']
      var isPages = location.hostname === PAGES_HOST
      var base = isPages ? PAGES_BASE : BASE
      var sites = isPages ? PAGES_SITES : []
      var path = location.pathname || '/'
      var target = null

      for (var i = 0; i < sites.length; i++) {
        var sub = sites[i]
        if (path.indexOf(sub) === 0) {
          var subRest = path.slice(sub.length - 1) // 保留前导 /
          target = sub.slice(0, -1) + '/#' + subRest + location.search + location.hash
          break
        }
      }
      if (!target && path.indexOf(base) === 0 && path.length > base.length) {
        var rest = path.slice(base.length - 1) // 保留前导 /
        target = base.slice(0, -1) + '/#' + rest + location.search + location.hash
      }

      var requested = document.getElementById('requested')
      if (requested) requested.textContent = path + location.search + location.hash

      if (target) {
        var hint = document.getElementById('hint')
        if (hint) hint.textContent = '正在跳转到 ' + target
        // 用 replace：404 不该留在浏览器历史里，否则「后退」会回到一个空页面
        location.replace(target)
      }
    </script>
  </body>
</html>
