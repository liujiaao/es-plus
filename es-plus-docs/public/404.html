<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>页面不存在 · ES-Plus</title>
    <style>
      :root {
        --es-brand-primary: #3b82f6;
        --es-brand-accent: #06b6d4;
        --es-text-primary: #1f2329;
        --es-text-regular: #4b5563;
        --es-text-secondary: #8a919f;
        --es-bg-page: #f7f8fa;
        --es-border-light: #e4e8ee;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--es-bg-page);
        color: var(--es-text-primary);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      }
      .wrap { max-width: 560px; width: 100%; text-align: center; }
      .code {
        font-size: 72px;
        font-weight: 800;
        line-height: 1;
        margin: 0;
        background: linear-gradient(135deg, var(--es-brand-primary), var(--es-brand-accent));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { font-size: 14px; line-height: 1.7; color: var(--es-text-regular); margin: 0 0 8px; }
      code {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        font-size: 13px;
        background: #fff;
        border: 1px solid var(--es-border-light);
        border-radius: 6px;
        padding: 2px 6px;
        word-break: break-all;
      }
      .actions { margin-top: 24px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
      a.btn {
        display: inline-block;
        padding: 10px 20px;
        border-radius: 8px;
        font-size: 14px;
        text-decoration: none;
        border: 1px solid var(--es-border-light);
        color: var(--es-text-primary);
        background: #fff;
      }
      a.btn.primary {
        background: var(--es-brand-primary);
        border-color: var(--es-brand-primary);
        color: #fff;
      }
      .hint { margin-top: 20px; font-size: 12px; color: var(--es-text-secondary); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p class="code">404</p>
      <h1>这个地址没有对应页面</h1>
      <p>可能是链接过期、拼写有误，或者页面已经改名。</p>
      <p>请求的地址：<code id="requested"></code></p>
      <div class="actions">
        <a class="btn primary" id="home" href="./">返回文档首页</a>
        <a class="btn" href="https://github.com/liujiaao/es-plus" rel="noopener">GitHub 仓库</a>
      </div>
      <p class="hint" id="hint"></p>
    </div>

    <script>
      /*
       * 深链兜底：本站是 hash 路由（`/#/guide/installation`），但旧 sitemap、外部文章与
       * 聊天工具里的链接往往写成路径式（`/es-plus/guide/installation`）。这类地址在
       * GitHub Pages 上没有对应文件，会落到这个页面 —— 此处把路径改写成 hash 再跳一次，
       * 让「看起来指对了」的链接真的落到内容上，而不是停在 404。
       *
       * 这张 404 页是**整个 Pages 站点共用的**（GitHub Pages 只认发布根的那一份），
       * 所以 `/es-plus/es-pc/…`、`/es-plus/es-eui/…` 的深链也会落到这里。子站必须跳回
       * 子站自己的 hash —— 此前一律按主站改写，`/es-plus/es-pc/guide/x` 会被送去
       * `/es-plus/#/es-pc/guide/x`（主站的一条不存在的路由），等于把用户送错站点。
       *
       * BASE 与 SITES 必须与 vite.config.ts 的 SITE_HOSTNAME、src/utils/sites.ts 的
       * 三站清单一致：scripts/check-sitemap.mjs 会校验，并**用假 location 真跑一遍**
       * 这里的改写逻辑（这个文件只在线上 404 时才执行，本地开发永远看不见）。
       */
      var BASE = '/es-plus/'
      // 子站前缀：从 sites.ts 的三站清单抄来（json 之外的唯一副本），按长度降序即天然正确
      var SITES = ['/es-plus/es-pc/', '/es-plus/es-eui/']
      var path = location.pathname || '/'
      var target = null

      for (var i = 0; i < SITES.length; i++) {
        var sub = SITES[i]
        if (path.indexOf(sub) === 0) {
          var subRest = path.slice(sub.length - 1) // 保留前导 /
          target = sub.slice(0, -1) + '/#' + subRest + location.search + location.hash
          break
        }
      }
      if (!target && path.indexOf(BASE) === 0 && path.length > BASE.length) {
        var rest = path.slice(BASE.length - 1) // 保留前导 /
        target = BASE.slice(0, -1) + '/#' + rest + location.search + location.hash
      }

      var requested = document.getElementById('requested')
      if (requested) requested.textContent = path + location.search + location.hash

      if (target) {
        var hint = document.getElementById('hint')
        if (hint) hint.textContent = '正在跳转到 ' + target
        // 用 replace：404 不该留在浏览器历史里，否则「后退」会回到一个空页面
        location.replace(target)
      }
    </script>
  </body>
</html>
