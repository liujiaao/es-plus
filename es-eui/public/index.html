<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="<%= BASE_URL %>favicon.svg">

    <!-- 标题此前是「ES-EUI」—— 并入前的旧产品名，与站点自身的品牌（顶栏写 ES-Plus、
         包名 @es-plus/vue2）都不一致，标签页上显示的是另一个产品。 -->
    <title>ES-Plus 文档 · Vue 2 + Element UI 端</title>

    <!--
      本站是 **light-only**：不提供深色开关。设计 token 里虽然有 `.dark` 块（与另两站
      同一份单源），但本站没有给 <html> 挂这个类的代码；主题页讲的是「接入方在自己
      项目里怎么做暗色」，不是本站支持暗色。
      显式声明 color-scheme: light —— 否则系统处于深色时，浏览器会把 Element UI 的
      原生控件（滚动条、日期选择器）按深色渲染，与浅色页面打架。
    -->
    <meta name="color-scheme" content="light" />

    <!-- 静态 meta：本站此前 index.html 里除标题外没有任何 meta，分享出去是无描述裸链接。 -->
    <meta
      name="description"
      content="ES-Plus 的 Vue 2 + Element UI 渲染端文档：同一份 JSON 配置驱动 EsForm / EsTable / EsDialog / EsCrudPage，与 Vue 3 / Ant Design Vue 端共用同一套字段与列定义。"
    />
    <meta name="keywords" content="Vue 2, Element UI, CRUD, 配置化表单, 配置化表格, JSON Schema" />
    <link rel="canonical" href="https://liujiaao.github.io/es-plus/es-eui/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ES-Plus" />
    <meta property="og:title" content="ES-Plus 文档 · Vue 2 + Element UI 端" />
    <meta
      property="og:description"
      content="同一份 JSON 配置驱动 EsForm / EsTable / EsDialog / EsCrudPage，与 Vue 3 / Ant Design Vue 端共用同一套字段与列定义。"
    />
    <meta property="og:url" content="https://liujiaao.github.io/es-plus/es-eui/" />
    <meta property="og:image" content="https://liujiaao.github.io/es-plus/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://liujiaao.github.io/es-plus/og-image.png" />
  </head>
  <body>
    <noscript>
      <strong>We're sorry but this app doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
  </body>
</html>
